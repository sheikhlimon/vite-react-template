version: 2
registries:
  npm-registry:
    type: npm-registry
    url: https://registry.npmjs.org/
    token: ${{secrets.NPM_TOKEN}}

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "limon"
    assignees:
      - "limon"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "limon"
    assignees:
      - "limon"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "github-actions"